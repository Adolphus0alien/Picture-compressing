<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片压缩工具 · 精确压到指定体积</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --line:#e6e8ee;
    --line-strong:#d3d7e0;
    --text:#14181f;
    --muted:#6b7385;
    --dim:#98a0b0;
    --accent:#2f6bff;
    --accent-soft:#eef3ff;
    --ok:#0f9d58;
    --ok-soft:#e9f8ef;
    --warn:#c47b0a;
    --warn-soft:#fff6e6;
    --err:#d92d20;
    --err-soft:#fdecea;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  header{
    position:sticky;top:0;z-index:20;
    background:rgba(244,245,247,.86);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-in{
    max-width:1060px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .logo{
    width:32px;height:32px;border-radius:9px;flex:none;
    background:linear-gradient(145deg,#3b7bff,#2454d6);
    display:grid;place-items:center;
    box-shadow:0 4px 10px rgba(47,107,255,.28);
  }
  h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:.2px}
  .tag{
    font-size:11.5px;color:var(--ok);background:var(--ok-soft);
    padding:2px 8px;border-radius:999px;font-weight:600;
    border:1px solid rgba(15,157,88,.14);
  }
  .head-spacer{flex:1}
  .head-hint{font-size:12px;color:var(--dim)}

  main{max-width:1060px;margin:0 auto;padding:20px}

  /* 参数面板 */
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;
  }
  .panel-title{
    font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.6px;
    text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;
  }
  .panel-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .fields{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .control-row{display:flex;gap:6px}
  input[type=number],select{
    font:inherit;color:var(--text);
    background:#fbfbfd;border:1px solid var(--line-strong);border-radius:9px;
    padding:7px 10px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
  }
  input[type=number]{width:96px;font-variant-numeric:tabular-nums;font-weight:600}
  input[type=number]:focus,select:focus{
    border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(47,107,255,.13);
  }
  select{cursor:pointer;padding-right:26px;appearance:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7385' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 9px center;
  }
  .field-note{font-size:11.5px;color:var(--dim)}
  .switch{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    font-size:12.5px;font-weight:500;color:var(--text);
    padding:7px 0;
  }
  .switch input{
    appearance:none;-webkit-appearance:none;margin:0;
    width:32px;height:18px;border-radius:999px;background:#d7dbe3;
    position:relative;cursor:pointer;transition:background .18s;flex:none;
  }
  .switch input::after{
    content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
    border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.2);
    transition:transform .18s;
  }
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{transform:translateX(14px)}
  .quick{display:flex;gap:6px;margin-top:2px}
  .quick button{
    font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);
    background:#fbfbfd;border:1px solid var(--line-strong);border-radius:7px;
    padding:3px 9px;cursor:pointer;transition:all .14s;
  }
  .quick button:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  /* 拖放区 */
  .drop{
    background:var(--card);border:1.5px dashed var(--line-strong);border-radius:var(--radius);
    padding:34px 20px;text-align:center;cursor:pointer;
    transition:border-color .16s,background .16s,transform .16s;
    margin-bottom:16px;
  }
  .drop:hover{border-color:var(--accent);background:#fcfdff}
  .drop.over{border-color:var(--accent);background:var(--accent-soft);transform:scale(.996)}
  .drop-icon{
    width:46px;height:46px;margin:0 auto 10px;border-radius:12px;
    background:var(--accent-soft);display:grid;place-items:center;
  }
  .drop-main{font-size:14px;font-weight:600;color:var(--text)}
  .drop-main b{color:var(--accent)}
  .drop-sub{font-size:12px;color:var(--dim);margin-top:5px}

  /* 列表有内容时，拖放区收成一条 */
  .drop.compact{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;text-align:left;margin-bottom:12px;
  }
  .drop.compact .drop-icon{width:32px;height:32px;margin:0;border-radius:9px;flex:none}
  .drop.compact .drop-icon svg{width:16px;height:16px}
  .drop.compact .drop-main{font-size:13px}
  .drop.compact .drop-sub{display:none}
  .drop.compact::after{
    content:"点击继续添加 · ⌘V 粘贴";
    margin-left:auto;font-size:11.5px;color:var(--dim);white-space:nowrap;
  }

  /* 列表 */
  .list{display:flex;flex-direction:column;gap:10px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);
    display:flex;align-items:center;gap:14px;padding:12px 14px;
    animation:in .22s ease-out;
  }
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .thumb{
    width:58px;height:58px;border-radius:9px;flex:none;overflow:hidden;
    border:1px solid var(--line);cursor:zoom-in;position:relative;
    background:
      linear-gradient(45deg,#eef0f4 25%,transparent 25%),
      linear-gradient(-45deg,#eef0f4 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eef0f4 75%),
      linear-gradient(-45deg,transparent 75%,#eef0f4 75%);
    background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{flex:1;min-width:0}
  .fname{
    font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-bottom:5px;
  }
  .row2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .chip{
    font-variant-numeric:tabular-nums;font-weight:600;
    padding:1.5px 7px;border-radius:6px;background:#f2f4f8;color:#4a5261;
  }
  .chip.out{background:var(--ok-soft);color:#0a7a44}
  .arrow{color:var(--dim)}
  .dims{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11.5px}
  .save{color:var(--ok);font-weight:650;font-size:11.5px}
  .status{font-size:12px;white-space:nowrap;flex:none;min-width:110px;text-align:right}
  .st-wait{color:var(--dim)}
  .st-work{color:var(--accent);display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
  .st-ok{color:var(--ok);font-weight:600}
  .st-err{color:var(--err);font-weight:600}
  .acts{display:flex;gap:6px;flex:none}

  .spinner{
    width:12px;height:12px;border-radius:50%;
    border:2px solid rgba(47,107,255,.22);border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  button.btn{
    font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    border-radius:8px;padding:6px 12px;border:1px solid var(--line-strong);
    background:#fff;color:var(--text);transition:all .14s;white-space:nowrap;
  }
  button.btn:hover:not(:disabled){border-color:#b9c0cd;background:#fafbfd}
  button.btn:disabled{opacity:.42;cursor:not-allowed}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 2px 6px rgba(47,107,255,.24)}
  button.btn.primary:hover:not(:disabled){background:#2559e0;border-color:#2559e0}
  button.btn.ghost{color:var(--dim);border-color:transparent;background:transparent;padding:6px 8px}
  button.btn.ghost:hover{background:#f2f4f8;color:var(--err);border-color:transparent}

  /* 底部条 */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);
    transform:translateY(110%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  }
  .bar.show{transform:none}
  .bar-in{
    max-width:1060px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .stats{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;line-height:1.25}
  .stat b{font-size:15px;font-variant-numeric:tabular-nums;font-weight:650}
  .stat span{font-size:11px;color:var(--dim)}
  .bar-spacer{flex:1}
  .total-save{color:var(--ok)}

  .empty{color:var(--dim);font-size:12.5px;text-align:center;padding:6px 0 2px}

  @media(max-width:640px){
    .status{min-width:auto;font-size:11.5px}
    .card{flex-wrap:wrap}
    .acts{width:100%;justify-content:flex-end}
    .fields{gap:14px}
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15V6a2 2 0 0 1 2-2h10"/><path d="M20 9v9a2 2 0 0 1-2 2H8"/>
        <path d="M9 13l3 3 3-3"/><path d="M12 8v8"/>
      </svg>
    </div>
    <h1>图片压缩工具</h1>
    <span class="tag">本地处理 · 不上传</span>
    <div class="head-spacer"></div>
    <div class="head-hint">精确压到指定体积 · 支持批量</div>
  </div>
</header>

<main>
  <!-- 参数 -->
  <section class="panel">
    <div class="panel-title">压缩设置</div>
    <div class="fields">
      <div class="field">
        <label for="targetVal">目标体积上限</label>
        <div class="control-row">
          <input id="targetVal" type="number" min="5" step="1" value="300">
          <select id="targetUnit">
            <option value="1024" selected>KB</option>
            <option value="1048576">MB</option>
          </select>
        </div>
        <div class="quick">
          <button data-kb="100">100KB</button>
          <button data-kb="300">300KB</button>
          <button data-kb="500">500KB</button>
          <button data-kb="1024">1MB</button>
        </div>
      </div>

      <div class="field">
        <label for="formatSel">输出格式</label>
        <select id="formatSel">
          <option value="auto" selected>自动（推荐）</option>
          <option value="jpeg">JPEG（体积最小）</option>
          <option value="png">PNG（保留透明）</option>
          <option value="webp">WebP（更小体积）</option>
        </select>
        <div class="field-note">自动：照片转 JPEG，带透明保留 PNG</div>
      </div>

      <div class="field">
        <label for="maxEdge">最长边限制</label>
        <div class="control-row">
          <input id="maxEdge" type="number" min="0" step="50" placeholder="不限">
        </div>
        <div class="field-note">像素，留空表示不限制</div>
      </div>

      <div class="field">
        <label>已达标处理</label>
        <label class="switch">
          <input type="checkbox" id="forceRe">
          <span>已达标也重新编码</span>
        </label>
        <div class="field-note">默认关闭：本来就够小的图原样保留</div>
      </div>
    </div>
  </section>

  <!-- 拖放 -->
  <section class="drop" id="drop">
    <div class="drop-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f6bff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/>
        <path d="M21 15l-4.5-4.5L7 21"/>
      </svg>
    </div>
    <div class="drop-main">拖入图片，或<b>点击选择文件</b></div>
    <div class="drop-sub">支持 JPG / PNG / WebP / GIF · 可直接 ⌘V 粘贴截图 · 可一次拖入多张</div>
    <input type="file" id="picker" accept="image/*" multiple hidden>
  </section>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">还没有图片。拖入即开始压缩。</div>
</main>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="stats">
      <div class="stat"><b id="sCount">0</b><span>已处理</span></div>
      <div class="stat"><b id="sBefore" class="num">0 KB</b><span>压缩前</span></div>
      <div class="stat"><b id="sAfter" class="num">0 KB</b><span>压缩后</span></div>
      <div class="stat"><b id="sSave" class="num total-save">—</b><span>共节省</span></div>
    </div>
    <div class="bar-spacer"></div>
    <button class="btn ghost" id="clearBtn" style="color:#6b7385">清空列表</button>
    <button class="btn primary" id="zipBtn" disabled>打包下载 ZIP</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const $ = (s) => document.querySelector(s);
  const listEl = $("#list");
  const emptyEl = $("#empty");
  const barEl = $("#bar");

  const EXT = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };
  const MIME_BY_KEY = { jpeg: "image/jpeg", png: "image/png", webp: "image/webp" };

  let items = [];      // 每个文件一条
  let cfgVersion = 0;  // 参数版本，用于丢弃过期结果
  let seq = 0;

  /* ---------------- 参数 ---------------- */
  function readCfg(){
    const v = parseFloat($("#targetVal").value);
    const unit = parseInt($("#targetUnit").value, 10) || 1024;
    const raw = (isNaN(v) || v <= 0 ? 300 : v) * unit;
    const bytes = Math.max(5 * 1024, Math.round(raw));
    const format = $("#formatSel").value;
    const maxEdge = Math.max(0, parseInt($("#maxEdge").value, 10) || 0);
    const force = !!$("#forceRe").checked;
    // 留 3% 余量，避免平台按 1000/1024 不同口径卡在临界值
    return { bytes, safeBytes: Math.floor(bytes * 0.97), format, maxEdge, force };
  }

  function fmtBytes(n){
    if (!isFinite(n)) return "—";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) {
      const kb = n / 1024;
      return (kb < 100 ? kb.toFixed(1) : Math.round(kb)) + " KB";
    }
    return (n / 1048576).toFixed(2) + " MB";
  }

  /* ---------------- 图片装载（含 EXIF 方向修正） ---------------- */
  async function loadSource(file){
    if (window.createImageBitmap) {
      try {
        const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
        return { src: bmp, w: bmp.width, h: bmp.height, done: () => { if (bmp.close) bmp.close(); } };
      } catch (e) { /* 回退到 img */ }
    }
    const img = await new Promise((res, rej) => {
      const im = new Image();
      const url = URL.createObjectURL(file);
      im.onload = () => { URL.revokeObjectURL(url); res(im); };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("图片解码失败")); };
      im.src = url;
    });
    return { src: img, w: img.naturalWidth || img.width, h: img.naturalHeight || img.height, done: () => {} };
  }

  function hasAlpha(src){
    try {
      const s = 64;
      const c = document.createElement("canvas");
      c.width = s; c.height = s;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.clearRect(0, 0, s, s);
      ctx.drawImage(src, 0, 0, s, s);
      const d = ctx.getImageData(0, 0, s, s).data;
      for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
      return false;
    } catch (e) { return false; }
  }

  /* ---------------- 绘制与编码 ---------------- */
  function drawScaled(src, sw, sh, tw, th, bg){
    // 大比例缩小时逐次减半，避免一次缩放到小尺寸出现锯齿/发糊
    let cur = src, cw = sw, ch = sh;
    if (Math.max(sw, sh) / Math.max(tw, th) > 2) {
      const c0 = document.createElement("canvas");
      c0.width = cw; c0.height = ch;
      c0.getContext("2d").drawImage(src, 0, 0);
      cur = c0;
      while (cw / 2 > tw && ch / 2 > th && cw > 32 && ch > 32) {
        const nw = Math.max(tw, Math.floor(cw / 2));
        const nh = Math.max(th, Math.floor(ch / 2));
        const c1 = document.createElement("canvas");
        c1.width = nw; c1.height = nh;
        const x1 = c1.getContext("2d");
        x1.imageSmoothingEnabled = true;
        x1.imageSmoothingQuality = "high";
        x1.drawImage(cur, 0, 0, nw, nh);
        cur = c1; cw = nw; ch = nh;
      }
    }
    const out = document.createElement("canvas");
    out.width = tw; out.height = th;
    const ctx = out.getContext("2d");
    if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, tw, th); }
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(cur, 0, 0, tw, th);
    return out;
  }

  function toBlob(canvas, type, quality){
    return new Promise((res, rej) => {
      try {
        canvas.toBlob((b) => {
          if (!b) { rej(new Error("编码失败")); return; }
          res(b);
        }, type, quality);
      } catch (e) { rej(e); }
    });
  }

  /* ---------------- 核心：压到指定体积 ---------------- */
  async function fitToTarget(src, sw, sh, type, safeBytes, maxEdge){
    const MIN_Q = 0.5, MAX_Q = 0.95;
    let scale = 1;
    if (maxEdge > 0) {
      const longEdge = Math.max(sw, sh);
      if (longEdge > maxEdge) scale = maxEdge / longEdge;
    }
    const isLossy = (type !== "image/png");
    const bg = (type === "image/jpeg") ? "#ffffff" : null;

    for (let round = 0; round < 9; round++) {
      const tw = Math.max(1, Math.round(sw * scale));
      const th = Math.max(1, Math.round(sh * scale));
      const canvas = drawScaled(src, sw, sh, tw, th, bg);

      if (!isLossy) {
        const b = await toBlob(canvas, type);
        if (b.size <= safeBytes) return { blob: b, w: tw, h: th, quality: null };
      } else {
        // 先试最高质量，达标即用
        const top = await toBlob(canvas, type, MAX_Q);
        if (top.size <= safeBytes) return { blob: top, w: tw, h: th, quality: MAX_Q };

        // 二分找最高可用质量
        let lo = MIN_Q, hi = MAX_Q, best = null;
        for (let i = 0; i < 7; i++) {
          const mid = (lo + hi) / 2;
          const b = await toBlob(canvas, type, mid);
          if (b.size <= safeBytes) { best = { blob: b, w: tw, h: th, quality: mid }; lo = mid; }
          else hi = mid;
        }
        if (best) return best;

        const low = await toBlob(canvas, type, MIN_Q);
        if (low.size <= safeBytes) return { blob: low, w: tw, h: th, quality: MIN_Q };
      }

      scale *= 0.82;
      if (Math.max(tw, th) <= 80) break;
    }
    return null;
  }

  function pickType(item, cfg, src){
    if (cfg.format !== "auto") return MIME_BY_KEY[cfg.format];
    const orig = (item.file.type || "").toLowerCase();
    const isJpeg = /jpe?g/.test(orig);
    if (isJpeg) return "image/jpeg";
    // PNG / WebP / GIF 等：有透明通道才保 PNG，否则转 JPEG 收益极大
    if (hasAlpha(src)) return "image/png";
    return "image/jpeg";
  }

  /* ---------------- 单项处理 ---------------- */
  function passthrough(item, label){
    if (item.outUrl) URL.revokeObjectURL(item.outUrl);
    item.outBlob = item.file;
    item.outUrl = URL.createObjectURL(item.file);
    item.outName = item.name;
    item.outW = item.srcW || 0;
    item.outH = item.srcH || 0;
    item.outType = item.file.type || "";
    item.outSize = item.file.size;
    item.quality = null;
    item.passthrough = label || "原图已达标";
    setStatus(item, "done");
  }

  async function processItem(item){
    const version = cfgVersion;
    setStatus(item, "working");
    try {
      const cfg = readCfg();

      // 本来就比上限小：原样保留，避免白白掉画质
      if (!cfg.force && item.file.size <= cfg.safeBytes && cfg.maxEdge === 0) {
        item.srcW = item.srcW || 0;
        item.srcH = item.srcH || 0;
        const loaded0 = await loadSource(item.file);
        item.srcW = loaded0.w; item.srcH = loaded0.h;
        loaded0.done();
        if (version !== cfgVersion) return;
        passthrough(item, "原图已达标");
        updateSummary();
        return;
      }

      const loaded = await loadSource(item.file);
      if (version !== cfgVersion) { loaded.done(); return; }

      item.srcW = loaded.w;
      item.srcH = loaded.h;

      const type = pickType(item, cfg, loaded.src);
      let result = await fitToTarget(loaded.src, loaded.w, loaded.h, type, cfg.safeBytes, cfg.maxEdge);

      // PNG 压不下来时，退一步转 JPEG（无透明的情况下）
      if (!result && type === "image/png" && !hasAlpha(loaded.src)) {
        result = await fitToTarget(loaded.src, loaded.w, loaded.h, "image/jpeg", cfg.safeBytes, cfg.maxEdge);
      }
      loaded.done();

      if (version !== cfgVersion) return;

      if (!result) {
        setStatus(item, "fail", "压不到 " + fmtBytes(cfg.bytes));
        return;
      }

      // 重压后反而更大（小图常见）：保留原图
      if (result.blob.size >= item.file.size && item.file.size <= cfg.safeBytes && cfg.maxEdge === 0) {
        passthrough(item, "原图更小");
        updateSummary();
        return;
      }

      // 若编码器不认目标格式（如老浏览器不支持 WebP），会回落到 PNG，及时纠正
      const realType = result.blob.type || type;
      const ext = EXT[realType] || EXT[type] || "jpg";
      const base = item.baseName;
      const outName = base + "." + ext;

      if (item.outUrl) URL.revokeObjectURL(item.outUrl);
      item.outBlob = result.blob;
      item.outUrl = URL.createObjectURL(result.blob);
      item.outName = outName;
      item.outW = result.w;
      item.outH = result.h;
      item.outType = realType;
      item.outSize = result.blob.size;
      item.quality = result.quality;
      item.passthrough = null;

      setStatus(item, "done");
    } catch (e) {
      setStatus(item, "fail", e && e.message ? e.message : "处理失败");
    }
    updateSummary();
  }

  /* ---------------- 卡片 DOM ---------------- */
  function addFile(file){
    if (!/^image\//.test(file.type || "")) return;
    const name = file.name || ("图片_" + Date.now());
    const dot = name.lastIndexOf(".");
    const base = dot > 0 ? name.slice(0, dot) : name;

    const item = {
      id: ++seq,
      file: file,
      name: name,
      baseName: base,
      origSize: file.size,
      status: "wait",
      el: null
    };

    const card = document.createElement("div");
    card.className = "card";

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.title = "点击查看压缩后效果";
    const timg = document.createElement("img");
    item.inUrl = URL.createObjectURL(file);
    timg.src = item.inUrl;
    timg.alt = name;
    thumb.appendChild(timg);
    thumb.addEventListener("click", () => {
      const u = item.outUrl || item.inUrl;
      if (u) window.open(u, "_blank");
    });

    const meta = document.createElement("div");
    meta.className = "meta";
    const fname = document.createElement("div");
    fname.className = "fname";
    fname.textContent = name;
    fname.title = name;
    const row2 = document.createElement("div");
    row2.className = "row2";
    row2.innerHTML = '<span class="chip num">' + fmtBytes(item.origSize) + '</span>' +
                     '<span class="arrow">→</span>' +
                     '<span class="chip num out" data-out>压缩中…</span>' +
                     '<span class="dims" data-dims></span>' +
                     '<span class="save" data-save></span>';
    meta.appendChild(fname);
    meta.appendChild(row2);

    const status = document.createElement("div");
    status.className = "status st-wait";
    status.textContent = "排队中";

    const acts = document.createElement("div");
    acts.className = "acts";
    const dl = document.createElement("button");
    dl.className = "btn";
    dl.textContent = "下载";
    dl.disabled = true;
    dl.addEventListener("click", () => downloadItem(item));
    const rm = document.createElement("button");
    rm.className = "btn ghost";
    rm.textContent = "✕";
    rm.title = "移除";
    rm.addEventListener("click", () => removeItem(item));
    acts.appendChild(dl);
    acts.appendChild(rm);

    item.el = card;
    item.ui = { thumb, timg, out: row2.querySelector("[data-out]"), dims: row2.querySelector("[data-dims]"),
                save: row2.querySelector("[data-save]"), status, dl };

    card.appendChild(thumb);
    card.appendChild(meta);
    card.appendChild(status);
    card.appendChild(acts);
    listEl.appendChild(card);

    items.push(item);
    emptyEl.style.display = "none";
    barEl.classList.add("show");
    drop.classList.add("compact");
    processItem(item);
    updateSummary();
  }

  function setStatus(item, kind, msg){
    item.status = kind;
    const ui = item.ui;
    if (kind === "working") {
      ui.status.className = "status st-work";
      ui.status.innerHTML = '<span class="spinner"></span>压缩中';
      ui.dl.disabled = true;
    } else if (kind === "done") {
      const pct = item.origSize > 0 ? Math.max(0, Math.round((1 - item.outSize / item.origSize) * 100)) : 0;
      ui.dl.disabled = false;
      ui.out.textContent = fmtBytes(item.outSize);
      ui.dims.textContent = item.srcW ? (item.srcW + "×" + item.srcH +
        (item.outW !== item.srcW || item.outH !== item.srcH ? " → " + item.outW + "×" + item.outH : "")) : "";
      if (item.passthrough) {
        ui.save.textContent = "未重压";
      } else if (item.outSize < item.origSize) {
        ui.save.textContent = "↓" + pct + "%";
      } else {
        ui.save.textContent = "已达标";
      }
      ui.status.className = "status st-ok";
      if (item.passthrough) {
        ui.status.textContent = item.passthrough;
      } else {
        const qtxt = item.quality ? " · 质量 " + Math.round(item.quality * 100) : "";
        const conv = (item.outType && item.file.type && item.outType !== item.file.type)
          ? " · 转 " + (EXT[item.outType] || "").toUpperCase() : "";
        ui.status.textContent = "完成" + qtxt + conv;
      }
      ui.thumb.title = "点击查看压缩后图片";
    } else if (kind === "fail") {
      ui.status.className = "status st-err";
      ui.status.textContent = msg || "失败";
      ui.out.textContent = "未达标";
      ui.dl.disabled = true;
    }
    updateSummary();
  }

  function downloadItem(item){
    if (!item.outBlob) return;
    const a = document.createElement("a");
    a.href = item.outUrl;
    a.download = item.outName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function removeItem(item){
    const i = items.indexOf(item);
    if (i >= 0) items.splice(i, 1);
    if (item.inUrl) URL.revokeObjectURL(item.inUrl);
    if (item.outUrl) URL.revokeObjectURL(item.outUrl);
    if (item.el) item.el.remove();
    updateSummary();
    if (items.length === 0) {
      emptyEl.style.display = "";
      barEl.classList.remove("show");
      drop.classList.remove("compact");
    }
  }

  function updateSummary(){
    const done = items.filter(i => i.status === "done");
    let before = 0, after = 0;
    done.forEach(i => { before += i.origSize; after += i.outSize; });
    $("#sCount").textContent = done.length + (items.length !== done.length ? " / " + items.length : "");
    $("#sBefore").textContent = fmtBytes(before);
    $("#sAfter").textContent = fmtBytes(after);
    $("#sSave").textContent = before > 0
      ? fmtBytes(before - after) + "（" + Math.round((1 - after / before) * 100) + "%）"
      : "—";
    $("#zipBtn").disabled = done.length === 0;
  }

  /* ---------------- ZIP（STORE，无第三方依赖） ---------------- */
  const CRC_TABLE = (function(){
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(u8){
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZip(entries){
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;

    entries.forEach(function(e){
      const nameBytes = enc.encode(e.name);
      const data = e.data;
      const crc = crc32(data);

      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);   // UTF-8 文件名
      lv.setUint16(8, 0, true);        // STORE
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0x21, true);    // 1980-01-01
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      parts.push(local, data);

      const cd = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x21, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      offset += local.length + data.length;
    });

    let cdSize = 0;
    central.forEach(c => { cdSize += c.length; });

    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    return new Blob(parts.concat(central, [eocd]), { type: "application/zip" });
  }

  async function downloadZip(){
    const done = items.filter(i => i.status === "done" && i.outBlob);
    if (!done.length) return;
    const btn = $("#zipBtn");
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = "打包中…";
    try {
      const entries = [];
      const used = Object.create(null);
      for (const it of done) {
        let n = it.outName;
        if (used[n]) {
          const d = n.lastIndexOf(".");
          n = n.slice(0, d) + "_" + (++used[it.outName]) + n.slice(d);
        } else { used[n] = 1; }
        const buf = await it.outBlob.arrayBuffer();
        entries.push({ name: n, data: new Uint8Array(buf) });
      }
      const zip = buildZip(entries);
      const d = new Date();
      const p = (x) => String(x).padStart(2, "0");
      const fname = "压缩图片_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
                    "_" + p(d.getHours()) + p(d.getMinutes()) + ".zip";
      const url = URL.createObjectURL(zip);
      const a = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a);
      a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      alert("打包失败：" + (e && e.message ? e.message : e));
    } finally {
      btn.textContent = label;
      updateSummary();
    }
  }

  /* ---------------- 事件绑定 ---------------- */
  const drop = $("#drop");
  const picker = $("#picker");

  drop.addEventListener("click", () => picker.click());
  picker.addEventListener("change", () => {
    Array.from(picker.files || []).forEach(addFile);
    picker.value = "";
  });

  ["dragenter", "dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function(e){
    const dt = e.dataTransfer;
    if (dt && dt.files) Array.from(dt.files).forEach(addFile);
  });

  // 整页接收拖放，避免浏览器直接打开图片
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", function(e){
    e.preventDefault();
    drop.classList.remove("over");
    if (e.target && drop.contains(e.target)) return; // 已由 drop 区处理
    const dt = e.dataTransfer;
    if (dt && dt.files && dt.files.length) Array.from(dt.files).forEach(addFile);
  });

  // 粘贴截图
  window.addEventListener("paste", function(e){
    const dt = e.clipboardData;
    if (!dt) return;
    const files = [];
    if (dt.files && dt.files.length) Array.from(dt.files).forEach(f => files.push(f));
    else if (dt.items) {
      Array.from(dt.items).forEach(function(it){
        if (it.kind === "file") { const f = it.getAsFile(); if (f) files.push(f); }
      });
    }
    if (files.length) { e.preventDefault(); files.forEach(addFile); }
  });

  // 参数变化 → 全部重压（防抖）
  let timer = null;
  function scheduleReprocess(){
    cfgVersion++;
    clearTimeout(timer);
    timer = setTimeout(function(){
      items.forEach(function(it){
        if (it.outUrl) { URL.revokeObjectURL(it.outUrl); }
        it.outBlob = null; it.outUrl = null;
        it.ui.dl.disabled = true;
        it.ui.out.textContent = "…";
        it.ui.dims.textContent = "";
        it.ui.save.textContent = "";
        processItem(it);
      });
      updateSummary();
    }, 380);
  }

  $("#targetVal").addEventListener("input", scheduleReprocess);
  $("#targetUnit").addEventListener("change", scheduleReprocess);
  $("#formatSel").addEventListener("change", scheduleReprocess);
  $("#maxEdge").addEventListener("input", scheduleReprocess);
  $("#forceRe").addEventListener("change", scheduleReprocess);

  document.querySelectorAll(".quick button").forEach(function(b){
    b.addEventListener("click", function(){
      const kb = parseInt(b.dataset.kb, 10);
      if (kb >= 1024) { $("#targetVal").value = kb / 1024; $("#targetUnit").value = "1048576"; }
      else { $("#targetVal").value = kb; $("#targetUnit").value = "1024"; }
      scheduleReprocess();
    });
  });

  $("#zipBtn").addEventListener("click", downloadZip);
  $("#clearBtn").addEventListener("click", function(){
    while (items.length) removeItem(items[0]);
    cfgVersion++;
  });

  // 拖入后按参数立即处理；初始 summary
  updateSummary();
})();
</script>
</body>
</html>
